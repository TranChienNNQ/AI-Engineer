   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(72.450359 316.067203)">DỮ LIỆU CÓ THỂ CHỨA INJECTION</text>
