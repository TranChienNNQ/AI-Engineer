   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(374.684297 258.563828)">CONTEXT BUILDER</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(364.478359 275.673125)">Lọc quyền → xếp hạng</text>
