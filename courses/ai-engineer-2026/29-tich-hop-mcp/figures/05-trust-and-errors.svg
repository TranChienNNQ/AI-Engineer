   <g id="text_1">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(139.617187 168.639844)">HOST POLICY</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(115.339062 184.728125)">Alias + allowlist + task</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(105.759375 199.759375)">Schema / budget / timeout</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(114.169531 215.759375)">Output / snapshot hash</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(433.276641 175.403828)">MCP EXCHANGE</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(416.449219 192.035313)">Discovery + list + call</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(406.125547 209.664531)">Result hoặc protocol error</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(733.354141 175.403828)">BACKEND GUARD</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(721.64 192.255313)">Workspace tại lúc đọc</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(715.81 210.047813)">Resolve URI / trả dữ liệu</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(113.251328 356.720134)">HOST / LOCAL ERROR</text>
