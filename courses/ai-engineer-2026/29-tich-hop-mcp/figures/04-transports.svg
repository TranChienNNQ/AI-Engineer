    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172d45" x="138.96" y="184.209542" transform="rotate(-0 138.96 184.209542)">IN-MEMORY</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172d45" x="389.376" y="182.965089" transform="rotate(-0 389.376 182.965089)">Client(server object)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(637.797078 174.441027)">Protocol dispatch trong process</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(644.935047 192.261027)">Không pipe, không HTTP/TCP</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172d45" x="138.96" y="295.603828" transform="rotate(-0 138.96 295.603828)">STDIO</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172d45" x="389.376" y="294.359375" transform="rotate(-0 389.376 294.359375)">Client → child server.py</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(633.789813 286.468672)">stdin/stdout: JSON-RPC mỗi dòng</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(639.135984 303.913125)">Log qua stderr; không cần port</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172d45" x="138.96" y="406.998114" transform="rotate(-0 138.96 406.998114)">HTTP-ASGI</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172d45" x="389.376" y="405.753661" transform="rotate(-0 389.376 405.753661)">Client → HTTP endpoint /mcp</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(633.401375 397.132489)">HTTP request/ASGI trong process</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(624.567859 414.858817)">Chưa socket, TLS, proxy hoặc OAuth</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="477.36" y="485.074286" transform="rotate(-0 477.36 485.074286)">Server HTTP local có entrypoint riêng để tự thử; bài chưa benchmark/deploy qua mạng.</text>
   </g>
  </g>
  <g id="text_11">
   <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172d45" x="51.48" y="38.919688" transform="rotate(-0 51.48 38.919688)">04 · Cùng API, ba đường kiểm có phạm vi khác nhau</text>
  </g>
  <g id="text_12">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #596777" x="51.48" y="59.4" transform="rotate(-0 51.48 59.4)">Cả ba dùng SDK thật; chỉ stdio tạo child process trong bộ kiểm tự động.</text>
  </g>
