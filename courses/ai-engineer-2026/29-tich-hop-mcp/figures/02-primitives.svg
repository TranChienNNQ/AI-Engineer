   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172d45" x="721.008" y="183.874386" transform="rotate(-0 721.008 183.874386)">tools/list → tools/call</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172d45" x="135.576" y="295.603828" transform="rotate(-0 135.576 295.603828)">RESOURCES</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(350.066906 285.835313)">kb://catalog</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(318.366281 303.282344)">kb://runbooks/{doc_id}</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(630.059484 285.864531)">resources/list hoặc templates/list</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(643.509562 304.134844)">→ resources/read URI cụ thể</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172d45" x="135.576" y="406.998114" transform="rotate(-0 135.576 406.998114)">PROMPTS</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172d45" x="382.608" y="405.876629" transform="rotate(-0 382.608 405.876629)">triage_ticket(ticket_id)</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(646.354094 397.229598)">prompts/list → prompts/get</text>
