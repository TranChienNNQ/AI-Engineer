  <g id="text_12">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #596777" x="51.48" y="59.4" transform="rotate(-0 51.48 59.4)">List để khám phá, call/read/get để sử dụng. Host quyết định cách đưa kết quả vào task.</text>
