   </g>
   <g id="text_10">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="477.36" y="482.142857" transform="rotate(-0 477.36 482.142857)">Resource body và prompt template không tự có thẩm quyền sửa system instruction.</text>
   </g>
