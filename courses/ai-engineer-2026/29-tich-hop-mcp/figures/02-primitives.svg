  <g id="text_11">
   <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172d45" x="51.48" y="36.037031" transform="rotate(-0 51.48 36.037031)">02 · Ba primitive: tool, resource, prompt</text>
