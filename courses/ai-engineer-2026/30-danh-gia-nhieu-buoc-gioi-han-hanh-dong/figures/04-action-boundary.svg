   <g id="text_1">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(129.11325 195.923828)">MODEL TURN</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(112.567703 212.555313)">View cap → reserve</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(119.882703 230.155313)">→ parse decision</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(417.068906 197.159844)">TOOL BOUNDARY</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(401.900937 212.279375)">Reserve → scope/intent</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(393.772812 228.855156)">→ evidence/review/version</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(709.813312 195.923828)">DOMAIN EFFECT</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(700.750344 213.188672)">Read / commit note</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(705.899719 230.155313)">→ journal + result</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(178.181531 367.915313)">Happy: 6 turn + 5 tool call</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(149.708719 385.515313)">19 synthetic units / 310 modeled ms</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(630.392328 368.980938)">Deadline 300 ms</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(564.259125 385.993125)">Write đã xong; final bị chặn; cần đối soát</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="477.36" y="476.28" transform="rotate(-0 477.36 476.28)">Đồng hồ/cost giả, tuần tự trong RAM; chưa actual I/O timeout, billing hoặc distributed quota.</text>
   </g>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172d45" x="51.48" y="38.008125" transform="rotate(-0 51.48 38.008125)">04 · Reserve trước dispatch, kiểm lại trước effect</text>
  </g>
  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #596777" x="51.48" y="59.4" transform="rotate(-0 51.48 59.4)">Giới hạn nằm trong trusted host; output model không được sửa counter hoặc tự cấp review.</text>
  </g>
