   <g id="text_1">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(128.81075 184.198114)">CONTROLLER</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(106.742 201.049598)">Giữ cùng intent/key K</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(119.152234 218.552489)">Gửi append_note</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(426.257266 184.198114)">BACKEND COMMIT</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(429.228125 200.829598)">Note + receipt(K)</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(434.740156 218.649598)">Cùng vùng lock</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(738.412844 184.843504)">RESPONSE BỊ MẤT</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(718.904172 201.049598)">Caller không có xác nhận</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(736.280734 219.398114)">State = UNKNOWN</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(427.633984 361.658203)">ĐỐI SOÁT CÙNG K</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(398.915391 376.935313)">Receipt đúng → SUCCEEDED</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(382.829609 394.535313)">Không có receipt → giữ UNKNOWN</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #bd4949" transform="translate(107.192312 359.351211)">Không tự tạo key mới</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #bd4949" transform="translate(134.407 373.68)">để “thử lại”</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle" x="477.36" y="476.28" transform="rotate(-0 477.36 476.28)">Cùng K + cùng action → receipt cũ, không thêm note. Cùng K + khác args → conflict.</text>
   </g>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172d45" x="51.48" y="38.1775" transform="rotate(-0 51.48 38.1775)">05 · Mất response không làm effect biến mất</text>
  </g>
  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #596777" x="51.48" y="59.4" transform="rotate(-0 51.48 59.4)">Một Backend/RLock trong RAM · chưa có durability hoặc distributed exactly-once.</text>
  </g>
