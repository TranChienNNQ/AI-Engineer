   <g id="text_1">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(158.097781 193.434129)">BLOCK WEIGHTS</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(130.963406 208.553661)">[−1,−.5,0,.5,1,.2] + pad0/0</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(443.978844 193.522411)">SCALE = absmax = 1</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(453.329625 209.522411)">Nearest NF4 level</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(739.654312 193.870145)">CODES 0..15</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(716.219156 207.820145)">[0, 2, 7, 12, 15, 9, 7, 7]</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(176.715422 347.395313)">Hai codes [0,2] → byte0x20=32</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(193.124328 364.995313)">low nibble0 / high nibble2</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(587.096531 347.919375)">Unpack → lookup × scale → FP32 matmul</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172d45" transform="translate(596.294969 364.119375)">Giữ grad theo input, không học codes</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #bd4949" x="477.36" y="458.691429" transform="rotate(-0 477.36 458.691429)">NF4 không có các mức cách đều như uniform INT4; quantized base khác original FP32 base.</text>
   </g>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172d45" x="51.48" y="35.277188" transform="rotate(-0 51.48 35.277188)">04 · NF4: codebook + block scale + packed nibbles</text>
  </g>
  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #596777" x="51.48" y="59.4" transform="rotate(-0 51.48 59.4)">Local CPU format: block32, FP32 scale; hình dùng block8 để nhìn padding. Không có DQ/paged kernels.</text>
  </g>
